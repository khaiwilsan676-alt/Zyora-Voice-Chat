name: Build Zyora Native APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android-native/**'
      - 'android/**'
      - '.github/workflows/build-native-android.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android-native/**'
      - '.github/workflows/build-native-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify native Google sign-in signing certificate
        working-directory: android-native
        run: |
          gradle :app:signingReport --no-daemon
          echo "The SHA-1/SHA-256 above must match the Android app fingerprints registered in Firebase."

      - name: Build native debug APK
        working-directory: android-native
        env:
          HURRY_VERSION_NAME: "1.0.${{ github.run_number }}"
          FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish versioned Native APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hurry-native-${{ github.run_number }}
          name: Zyora Native ${{ github.run_number }}
          body: Zyora Native APK. Backend API: https://zyora-voice-chat.onrender.com. Includes current Native app code from commit ${{ github.sha }}.
          make_latest: true
          files: android-native/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish stable Native APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hurry-native-latest
          name: Zyora Native Latest
          body: Always points to the newest successful Zyora Native Android build.
          prerelease: false
          make_latest: false
          files: android-native/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zyora-native-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

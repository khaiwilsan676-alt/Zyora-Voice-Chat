name: Build Zyora Native APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android-native/**'
      - '.github/workflows/build-native-android.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android-native/**'
      - '.github/workflows/build-native-android.yml'

permissions:
  contents: write

concurrency:
  group: zyora-native-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native-apk:
    name: Compile Native Android app
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build actual Native APK
        working-directory: android-native
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          HURRY_VERSION_NAME: "1.0.${{ github.run_number }}"
          FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: gradle assembleDebug --no-daemon --stacktrace --max-workers=2

      - name: Upload Native APK
        uses: actions/upload-artifact@v4
        with:
          name: zyora-native-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Native APK release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zyora-native-${{ github.run_number }}
          name: Zyora Native ${{ github.run_number }}
          body: Actual Kotlin/Jetpack Compose Native APK from android-native, commit ${{ github.sha }}.
          files: android-native/app/build/outputs/apk/debug/app-debug.apk

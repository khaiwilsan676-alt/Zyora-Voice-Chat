name: Build Zyora Native APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android-native/**'
      - '.github/workflows/build-native-android.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android-native/**'
      - '.github/workflows/build-native-android.yml'

permissions:
  contents: write

concurrency:
  group: zyora-native-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-native-apk:
    name: Compile Native Android app
    runs-on: ubuntu-latest
    env:
      APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
      APPETIZE_PUBLIC_KEY: ${{ secrets.APPETIZE_PUBLIC_KEY }}
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate Google sign-in build configuration
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          if [ -z "$GOOGLE_WEB_CLIENT_ID" ]; then
            echo "::error::GOOGLE_WEB_CLIENT_ID is empty for this build."
            exit 1
          fi
          echo "Google Web Client ID secret is present (value hidden)."

      - name: Build actual Native APK
        working-directory: android-native
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          HURRY_VERSION_NAME: "1.0.${{ github.run_number }}"
          FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: gradle assembleDebug --no-daemon --stacktrace --max-workers=2

      - name: Report APK signing certificate fingerprint for Google OAuth
        if: ${{ success() }}
        run: |
          APK="android-native/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/zyora-apk-certificate.txt
          SHA1=$(sed -n 's/.*certificate SHA-1 digest: //p' /tmp/zyora-apk-certificate.txt | head -n 1)
          echo "## Google OAuth Android certificate" >> "$GITHUB_STEP_SUMMARY"
          echo "Package: com.hawa.app" >> "$GITHUB_STEP_SUMMARY"
          echo "APK signing SHA-1: \`$SHA1\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Compare this SHA-1 with the Android OAuth client registered in Google Cloud."

      - name: Stream Native APK in browser with Appetize
        if: ${{ env.APPETIZE_API_TOKEN != '' && github.event_name != 'pull_request' }}
        id: appetize
        uses: appetizeio/github-action-appetize@v1.1.0
        with:
          apiToken: ${{ env.APPETIZE_API_TOKEN }}
          publicKey: ${{ env.APPETIZE_PUBLIC_KEY }}
          appFile: android-native/app/build/outputs/apk/debug/app-debug.apk
          platform: android
          note: Zyora native commit ${{ github.sha }}
          timeout: '600'

      - name: Publish browser preview link
        if: ${{ steps.appetize.outputs.publicKey != '' }}
        run: |
          echo "## Zyora Native Browser Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "Open the actual Android app in your browser: https://appetize.io/app/${{ steps.appetize.outputs.publicKey }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Native APK
        uses: actions/upload-artifact@v4
        with:
          name: zyora-native-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Native APK release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zyora-native-${{ github.run_number }}
          name: Zyora Native ${{ github.run_number }}
          body: Actual Kotlin/Jetpack Compose Native APK from android-native, commit ${{ github.sha }}.
          files: android-native/app/build/outputs/apk/debug/app-debug.apk

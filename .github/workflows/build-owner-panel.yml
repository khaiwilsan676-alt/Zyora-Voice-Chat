name: Build Owner Panel

on:
  push:
    branches: [main]
    paths:
      - "app/owner/**"
      - "app/layout.tsx"
      - "app/globals.css"
      - "components/**"
      - "src/lib/**"
      - "package.json"
      - "tsconfig.json"
      - "tailwind.config.ts"
      - "postcss.config.mjs"
      - "next.config.ts"
      - ".github/workflows/build-owner-panel.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/owner/**"
      - "app/layout.tsx"
      - "app/globals.css"
      - "components/**"
      - "src/lib/**"
      - "package.json"
      - "tsconfig.json"
      - "tailwind.config.ts"
      - "postcss.config.mjs"
      - "next.config.ts"
      - ".github/workflows/build-owner-panel.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Build static Owner Panel
        run: npm run build

      - name: Upload static preview
        uses: actions/upload-artifact@v4
        with:
          name: zyora-owner-panel-static
          path: out/
          if-no-files-found: error

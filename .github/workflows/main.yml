name: Build Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Build Next.js
        run: npm run build

      # The web app is server-rendered and its API routes cannot be exported to ./out.
      # The native shell loads the deployed Zyora URL (capacitor.config.ts server.url).
      # Capacitor still requires a webDir containing index.html for sync.
      - name: Prepare Capacitor Web Directory
        run: |
          mkdir -p out
          cat > out/index.html <<'HTMLEOF'
          <!doctype html>
          <html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body></body></html>
          HTMLEOF

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Copy google-services.json
        run: |
          mkdir -p android/app
          cat <<'JSONEOF' > android/app/google-services.json
          {
            "project_info": {
              "project_number": "164837688319",
              "project_id": "hawa-a74a6",
              "storage_bucket": "hawa-a74a6.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:164837688319:android:2e58fa563dfb6b21dd9dca",
                  "android_client_info": {
                    "package_name": "com.hawa.app"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "164837688319-uu6uhd20mner48etd4ci6aeu3nuvt8gp.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyCnTCkTKXHjsWBQmgSqfiJtR5kjZgb5aUY"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "164837688319-uu6uhd20mner48etd4ci6aeu3nuvt8gp.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSONEOF

      - name: Fix Duplicate Kotlin Dependencies
        run: |
          mkdir -p android/gradle
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

          cat <<'GRADLEEOF' >> android/build.gradle

          allprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          GRADLEEOF

      - name: Build Release APK
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.parallel=true
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --max-workers=2 assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zyora-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

name: Deploy Hurry to GitHub Pages

# Zyora is a server-rendered Next.js app and is deployed on Vercel.
# GitHub Pages cannot host its API routes or server-side profile persistence.
# Keep this workflow manual-only so pushes do not trigger a broken static deploy.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Explain deployment target
        run: |
          echo "Build completed. This repository uses server-side Next.js features that GitHub Pages cannot run."
          echo "Deploy this app through Vercel so API routes and server profile persistence remain available."
          if [ ! -d out ]; then
            echo "No static export directory exists; skipping GitHub Pages publication."
          else
            echo "Static export directory found, but publication is intentionally disabled for this server app."
          fi

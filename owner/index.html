<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Zyora Owner Panel</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#08090d;color:#fff;font-family:Arial,sans-serif}
    iframe{display:block;width:100%;height:100%;border:0;background:#08090d}
    #fallback{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;background:#08090d}
    a{color:#8bbcff}
  </style>
</head>
<body>
  <iframe id="panel" src="https://zyora-voice-chat.vercel.app/owner" title="Zyora Owner Panel" allow="clipboard-read; clipboard-write; camera; microphone"></iframe>
  <div id="fallback">Owner Panel couldn't be embedded in this browser.<br><a href="https://zyora-voice-chat.vercel.app/owner">Open Owner Panel</a></div>
  <script>
    const frame=document.getElementById('panel');
    frame.addEventListener('error',()=>{document.getElementById('fallback').style.display='flex';});
  </script>
</body>
</html>

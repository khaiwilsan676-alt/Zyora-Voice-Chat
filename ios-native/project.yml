name: Zyora
options:
  bundleIdPrefix: com.zyora
  deploymentTarget:
    iOS: "16.0"
targets:
  Zyora:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zyora.voicechat
        PRODUCT_NAME: Zyora
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Zyora
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
